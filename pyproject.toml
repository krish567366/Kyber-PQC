[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyber-pqc"
version = "2.1.1"
description = "Native high-performance ML-KEM-512 (Kyber-512) implementation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Bajpai Labs", email = "hello@bajpailabs.com"}]
keywords = ["post-quantum", "cryptography", "kyber", "security", "ml-kem"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "flake8>=5.0.0"
]
benchmark = [
    "pytest-benchmark>=4.0.0"
]

[project.urls]
Homepage = "https://quantum.postquantumlabs.in/kyber-pqc"
Documentation = "https://quantum.postquantumlabs.in/docs/kyber-pqc"
Repository = "https://github.com/krish567366/Kyber-PQC"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["kyber_pqc*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["kyber_pqc"]
