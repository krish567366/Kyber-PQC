name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  kyber-pqc:
    name: kyber-pqc / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install kyber-pqc with dev extras
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"

      - name: Run kyber-pqc tests
        run: python -m pytest src/tests/ -v --tb=short

      - name: Lint kyber-pqc
        run: python -m flake8 src/kyber_pqc/ --max-line-length=100
        continue-on-error: true
